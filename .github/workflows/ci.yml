name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04   # pinned: it still offers Python 3.8, the oldest interpreter Kodi 21 add-ons may meet
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: pip install requests pillow hypothesis pytest
      - name: Tests (source tree)
        run: make test
      - name: Tests (the unpacked release zip)
        run: make test-zip

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install requests pillow hypothesis pytest coverage pyflakes mypy Kodistubs kodi-addon-checker
      - name: Coverage (fails below the threshold in the Makefile)
        run: make coverage
      - name: Lint (pyflakes + mypy)
        run: make lint
      - name: Build zip
        run: make build
      - name: Kodi add-on checker (Omega), add-on and repository add-on
        run: |
          mkdir -p /tmp/check && for z in dist/*.zip; do unzip -q "$z" -d /tmp/check; done
          # the checker downloads the official add-on lists from github.com; a timeout there makes it crash
          # ('Repository' object has no attribute 'addons'), so each check gets up to 3 attempts
          check() { for i in 1 2 3; do kodi-addon-checker --branch omega "$1" && return 0; echo "::warning::checker attempt $i on $1 failed"; sleep 20; done; return 1; }
          check /tmp/check/plugin.image.photoprism
          check /tmp/check/repository.kodiprism
      - name: Repository content (what the repo branch would serve)
        run: python3 tools/build_repo.py dist/repo dist/*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: kodiprism-zips
          path: |
            dist/*.zip
            dist/repo
