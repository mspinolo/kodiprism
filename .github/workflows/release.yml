name: Release
# Two ways to release: push a tag vX.Y.Z, or press "Run workflow" on main (the tag is then created from addon.xml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pillow hypothesis pytest
      - name: Work out the tag and check it against addon.xml
        id: tag
        run: |
          v=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('plugin.image.photoprism/addon.xml').getroot().get('version'))")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != addon.xml v$v"; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = "main" ] || { echo "manual releases run from main only (got $GITHUB_REF_NAME)"; exit 1; }
            if gh release view "v$v" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null 2>&1; then
              echo "v$v already exists: bump the version in addon.xml first"; exit 1
            fi
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make test
      - run: make build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag }}" dist/plugin.image.photoprism-*.zip --title "${{ steps.tag.outputs.tag }}" --generate-notes --target "$GITHUB_SHA"

  repository:
    # then publish the new version in the Kodi repository (repo branch), so installed copies update by themselves
    needs: release
    uses: ./.github/workflows/repo.yml
    permissions:
      contents: write
