name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install requests pillow pyflakes mypy Kodistubs kodi-addon-checker
      - name: Tests
        run: make test
      - name: Lint (pyflakes + mypy)
        run: make lint
      - name: Build zip
        run: make build
      - name: Kodi add-on checker (Omega)
        run: |
          mkdir -p /tmp/check && unzip -q dist/*.zip -d /tmp/check
          kodi-addon-checker --branch omega /tmp/check/plugin.image.photoprism
      - uses: actions/upload-artifact@v4
        with:
          name: plugin.image.photoprism-zip
          path: dist/*.zip
